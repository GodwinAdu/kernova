name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/GodwinAdu/kernova/issues) first to avoid duplicates.

        **Security vulnerabilities must not be reported here.** See [SECURITY.md](https://github.com/GodwinAdu/kernova/blob/main/SECURITY.md).

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      multiple: true
      options:
        - "@kernova/framework"
        - "@kernova/sdk"
        - "@kernova/core"
        - "@kernova/cli"
        - "@kernova/types"
        - "create-kernova-app"
        - "@kernova/studio"
        - "Language SDK (sdks/)"
        - "Documentation"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: Run `npm ls @kernova/framework @kernova/sdk @kernova/core @kernova/cli`
      placeholder: "@kernova/framework@1.9.4"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or repository is the fastest way to get a fix.
      placeholder: |
        1. Create an agent with ...
        2. Call `app.ask('...')`
        3. See error ...
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      description: Paste relevant output. Remove any API keys or secrets first.
      render: shell

  - type: input
    id: provider
    attributes:
      label: Model provider and model
      placeholder: "OpenAI gpt-4o, Anthropic, Ollama llama3.1, ..."

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.11.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`kernova doctor` output (optional)"
      description: If the issue involves a model provider, run `npx kernova doctor` and paste the result.
      render: shell
