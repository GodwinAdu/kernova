name: Feature request
description: Suggest a new feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search [existing issues](https://github.com/GodwinAdu/kernova/issues) first. Someone may have proposed it already.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package would this change?
      multiple: true
      options:
        - "@kernova/framework"
        - "@kernova/sdk"
        - "@kernova/core"
        - "@kernova/cli"
        - "@kernova/types"
        - "create-kernova-app"
        - "@kernova/studio"
        - "Language SDK (sdks/)"
        - "Documentation"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or use case, not just the solution. "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Code samples of the API you'd want are very helpful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this
