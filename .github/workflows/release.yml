name: Release

# Publishes to npm when a version tag (for example v2.1.0) is pushed, then creates the GitHub
# release from that version's CHANGELOG.md section.
#
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere, and npm adds a provenance
# attestation to every package. One-time setup for each published package on npmjs.com:
# package → Settings → Trusted publishing → GitHub Actions, with repository GodwinAdu/kernova,
# workflow release.yml, and environment npm. (See CONTRIBUTING.md → Releasing.)
#
# Run it by hand (Actions → Release → Run workflow) for a dry run that shows what would be published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would be published
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Add required reviewers to this environment (Settings → Environments → npm) to approve
    # each release before it publishes
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Use npm 11.5.1 or later (needed for trusted publishing)
        run: npm install -g npm@^11.5.1

      - name: Release notes from CHANGELOG.md
        if: github.event_name == 'push'
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish new versions
        run: node scripts/publish.mjs ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}

      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
