[package]
name = "kernova"
version = "0.1.0"
edition = "2021"
description = "Kernova Rust SDK — async HTTP client for the Kernova Gateway API"
license = "MIT"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
